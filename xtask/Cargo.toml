[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
description = "Workspace automation (fetch/verify reference material to cache only)"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["full"] }
mc-launcher = { path = "../crates/mc-launcher" }
