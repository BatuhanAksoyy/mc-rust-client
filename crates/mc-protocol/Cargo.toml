[package]
name = "mc-protocol"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Minecraft Java protocol 776 codecs (VarInt, NBT, packets). No Mojang code."

[lints]
workspace = true

[dependencies]
thiserror = "2"
bytes = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "codecs"
harness = false
