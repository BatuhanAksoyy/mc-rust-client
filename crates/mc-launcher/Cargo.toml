[package]
name = "mc-launcher"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Version resolve + cache-only asset bootstrap (never vendors jars)"

[lints]
workspace = true

[dependencies]
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"
toml = "1"
tokio = { version = "1", features = ["macros", "rt"] }
