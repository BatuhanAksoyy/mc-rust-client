[package]
name = "mc-launcher"
version = "0.1.0"
edition = "2021"
description = "Version resolve + cache-only asset bootstrap (never vendors jars)"

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
clap = { version = "4", features = ["derive"] }
mc-auth = { path = "../mc-auth" }
