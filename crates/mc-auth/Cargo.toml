[package]
name = "mc-auth"
version = "0.1.0"
edition = "2021"
description = "Microsoft OAuth2 -> Xbox -> Minecraft auth + ownership gate"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
